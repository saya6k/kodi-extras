# threadbridge settings. The Kodi add-on writes its own copy to
# /home/osmc/.kodi/userdata/addon_data/script.service.threadbridge/threadbridge.conf,
# which the service reads after this file.

# The dongle's serial device. Empty: the first one in /dev/serial/by-id.
RADIO_DEVICE=""
# Home Assistant Connect ZBT-1/SkyConnect and Sonoff ZBDongle-E with
# OpenThread RCP firmware: 460800 with flow control. nRF52840 dongles: 115200.
RADIO_BAUDRATE="460800"
RADIO_FLOW_CONTROL="1"

# The network the Thread network is routed to (Ethernet or Wi-Fi).
BACKBONE_IF="eth0"

# Where the REST API listens. 127.0.0.1 keeps it on this box; 0.0.0.0 lets
# Home Assistant on another machine reach it. The API has no authentication.
REST_ADDRESS="127.0.0.1"
REST_PORT="8081"

# Lets Thread devices reach IPv4 hosts (NAT64 with NAT44 on the backbone).
NAT64="1"
# The ingress filter that keeps unsolicited traffic from the backbone out of
# the Thread network. Needs ipset and ip6tables support in the kernel.
FIREWALL="1"

# otbr-agent log level: 3 errors, 5 notices, 6 info, 7 debug.
DEBUG_LEVEL="5"
