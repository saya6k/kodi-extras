# atmos67 defaults. The Kodi add-on writes the same settings to
# /home/osmc/.kodi/userdata/addon_data/service.atmos67/atmos67.conf, which
# takes precedence over this file.

# Speaker layout preset: 2.0 5.1 5.1.2 5.1.4 7.1 7.1.2 7.1.4 7.1.6 9.1 9.1.2
# 9.1.4 9.1.6 22.2
LAYOUT=7.1.4
# A layout file in OpenJOC JSON format; replaces LAYOUT when set.
LAYOUT_FILE=

# Network interface the PTP clock runs on.
INTERFACE=eth0
PTP_DOMAIN=0

# Multicast address of the first stream of 8 speakers; further streams count
# up from it.
ADDRESS=239.69.67.1
# Audio held back before sending, in milliseconds. Raise it if the streams
# drop out during playback.
BUFFER_MS=100

# Correction: off, manual (the settings below) or auto (the measured design
# in AUTO_DESIGN with TRIMS added). The Kodi add-on sets these.
MODE=off
SUBS=1
# Linkwitz-Riley slope, 12 or 24 dB/octave, and crossovers per speaker group
# (front, center, surround, back, top), such as "front=80 top=100".
SLOPE=24
CROSSOVER=
# Output level trims in dB and delays in ms, such as "L=-1.5 SW1=2".
TRIMS=
DELAYS=
AUTO_DESIGN=
# Volume at start in dB; Kodi's volume keys change it while running.
VOLUME_DB=0
# A stream plan (JSON: name, address, channels); 8 channels a stream when empty.
STREAMS=
