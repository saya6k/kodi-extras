# PTP for AES67 (the media profile's message rates). The interface, the
# domain and the time stamping mode are given on the command line by
# /usr/lib/atmos67/atmos67-ptp.
#
# With these defaults the best clock on the network becomes grandmaster. When
# that is another device, the system clock of this machine follows it: turn
# off other time synchronisation then, and expect the system time to be
# whatever that grandmaster distributes. To keep this machine's own time, make
# it the grandmaster by lowering priority1 below the other clocks'.
[global]
priority1 128
logAnnounceInterval 1
announceReceiptTimeout 3
logSyncInterval -3
logMinDelayReqInterval 0
dscp_event 46
dscp_general 34
