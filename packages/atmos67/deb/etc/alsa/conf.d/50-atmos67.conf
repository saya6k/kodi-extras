# The playback side of the loopback that atmos67 captures from. Kodi offers
# passthrough of every format only on devices whose name starts with "hdmi",
# and opens them with the IEC 958 status bits as arguments.
pcm.hdmi_atmos67 {
    @args [ AES0 AES1 AES2 AES3 ]
    @args.AES0 { type integer default 0x06 }
    @args.AES1 { type integer default 0x82 }
    @args.AES2 { type integer default 0x00 }
    @args.AES3 { type integer default 0x02 }
    type hw
    card Loopback
    device 0
    subdevice 0
    hint {
        show on
        description "atmos67 (AES67)"
    }
}
